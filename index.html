<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Gallery | CodeAlpha</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1 class="title">Aesthetic <span>Collection</span></h1>
            <p>CodeAlpha Frontend Task - Image Gallery </p>
        </header>
        
        <div class="gallery-grid">
            <div class="gallery-item"><img src="Art 1.jpg" alt="Art 1"></div>
            <div class="gallery-item"><img src="Art 2.jpg" alt="Art 2"></div>
            <div class="gallery-item"><img src="Art 3.jpg" alt="Art 3"></div>
            <div class="gallery-item"><img src="Art 4.jpg" alt="Art 4"></div>
            <div class="gallery-item"><img src="Art 5.jpg" alt="Art 5"></div>
            <div class="gallery-item"><img src="Art 6.jpg" alt="Art 6"></div>
            <div class="gallery-item"><img src="Art 7.jpg" alt="Art 7"></div>
            <div class="gallery-item"><img src="Art 8.jpg" alt="Art 8"></div>
        </div>
    </div>

    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <button class="nav-btn prev">&#10094;</button>
        <img class="lightbox-content" id="fullImg">
        <button class="nav-btn next">&#10095;</button>
    </div>

    <footer>
        <p>Created by <strong>Aisha Saleem Qureshi</strong> for CodeAlpha Internship</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
